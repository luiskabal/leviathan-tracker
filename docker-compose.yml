services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leviathan
      POSTGRES_PASSWORD: leviathan
      POSTGRES_DB: leviathan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leviathan"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://leviathan:leviathan@postgres:5432/leviathan?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
